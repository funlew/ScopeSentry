# ScopeSentry 服务端本地开发编排（含 MongoDB / Redis）
# 用法：docker compose -f docker-compose.dev.yml up -d --build
# 文档：docs/LOCAL-DEV.md
#
# 该文件创建固定名网络 scopesentry-dev，扫描端工程（../ScopeSentry-Scan）
# 的 compose 会接入同一网络，用 mongodb / redis 两个服务名访问中间件。
name: scopesentry

networks:
  scopesentry-dev:
    name: scopesentry-dev
    driver: bridge

services:
  mongodb:
    image: mongo:7.0.4
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mongodb_password}
    volumes:
      - mongo-data:/data/db
    networks:
      - scopesentry-dev
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          -u "$$MONGO_INITDB_ROOT_USERNAME"
          -p "$$MONGO_INITDB_ROOT_PASSWORD"
          --authenticationDatabase admin
          --eval "db.adminCommand({ping:1}).ok" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.0.11
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-redis_password}
    volumes:
      - redis-data:/data
    networks:
      - scopesentry-dev
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 12

  scope-sentry:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    init: true
    restart: "no"
    stop_grace_period: 10s
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8082:8082"   # Web / API
      - "2345:2345"   # delve
    environment:
      TIMEZONE: Asia/Shanghai
      MONGODB_IP: mongodb
      MONGODB_PORT: "27017"
      MONGODB_DATABASE: ScopeSentry
      MONGODB_USER: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGODB_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-mongodb_password}
      REDIS_IP: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
    volumes:
      - .:/src
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
      # 运行根：config.yaml / PASSWORD / PLUGINKEY / files / uploads / images
      - ./.dev-data:/data

volumes:
  mongo-data:
  redis-data:
  go-mod:
  go-build:
